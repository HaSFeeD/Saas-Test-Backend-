[project]
name = "saas-backend"
version = "1.0.0"
description = "SaaS backend: people search with paywalled reports, credits, Stripe billing and third-party integrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.setuptools]
packages = ["app"]
